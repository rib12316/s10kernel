# workflow4 白盒节点（node [5]，2026-11-04）：按 round-7 采纳源码（direction-3b 单tile单TBuf、
# direction-5 细分核 cap16，mish_kernel.cpp sha256 e6e477a8…）复核白盒 42~52 分支映射——数据字段
# 与全部黑盒例逐字节冻结未动，仅将 note 中已失效的 workflow3 基线 tiling 推导改为当前源码实测推导
# （tileElems 权威实测经真 calc_mish_tiling_params 探针：fp32 ubFactor=6912、fp16=13824、bf16=7424，
