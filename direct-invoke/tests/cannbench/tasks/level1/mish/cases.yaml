# @ sha256 5832710fac556edb06bec1a1f3bca59c8d4d960121255dec579cd812494d107a
# （workflow2 创建 41 黑盒；workflow3 扩展白盒 42~52 并复核 note，52/52 全量通过）。
# case_id 1~52 的行自源文件逐字节复制（ID 与内容冻结不变，含白盒 42~52——归属白盒节点，
# 其 note 引用的 tiling 实测/源码哈希为 workflow3 基线口径，round-7 若改 tiling/缓冲结构
# 由白盒节点按新源码复核映射，本节点不改动）。
# 本轮新增黑盒 9 例（case_id 53~61，见文末分节注释；来源
# $WORK_DIR/0.1-黑盒测试设计.md 第 8.3 节定稿）：
#   53~55 rank-0 标量（R3「0 维标量按 1 元素」，上轮为规格外 S2、本轮入规格）；
#   56~58 mish 极小值点 -1.1924 定点（round-7 回归点名）；
#   59~60 全 -0 保号路径（[0,0] 仅生成 +0）；61 次正规输入下溢（round-7 回归点名）。
# note 前缀 L0-/L1-/L2-/WB- 均为测试设计标签，不改 proto 难度，不用于评测器过滤。
